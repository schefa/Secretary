file_uploads = On

; temporary directory for PHP file uploads
; adjust this if Joomla! reports missing manifests or can\'t find uploaded files
upload_tmp_dir = /var/www/html/tmp

memory_limit = 500M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 600
max_input_time = 300

; ── Hardening ───────────────────────────────────────────────────────────────
; Mounted read-only into every Joomla container (see the web role's
; compose.yml.j2). Joomla's own configuration.php covers error_reporting and
; force_ssl; these are the engine-level settings it cannot set.

; Drop the X-Powered-By header - it advertises the exact PHP patch level.
expose_php = Off

; Never render errors, stack traces or file paths into a response body.
; log_errors keeps them for the container log instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Session cookies are not readable from JavaScript, and are not sent on
; cross-site requests. Lax rather than Strict so ordinary inbound links still
; arrive logged in. The Secure flag comes from Joomla's force_ssl.
session.cookie_httponly = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; Remote URLs are legitimate for update checks (allow_url_fopen), but a remote
; URL must never be reachable as executable code.
allow_url_include = Off
