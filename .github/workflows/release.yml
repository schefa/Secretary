name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create for this release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict runs to the repository owner
        if: github.actor != github.repository_owner
        run: |
          echo "Only the repository owner (${{ github.repository_owner }}) can trigger this workflow."
          exit 1

  lint:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run phpcs
        run: vendor/bin/phpcs

  test:
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        working-directory: tests
        run: composer install --prefer-dist --no-progress

      - name: Run phpunit
        working-directory: tests
        run: vendor/bin/phpunit

  release:
    needs: [authorize, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in secretary.xml
        run: |
          TAG="${{ inputs.tag }}"
          sed -i "s#<version>[^<]*</version>#<version>${TAG}</version>#" secretary.xml com_secretary/secretary.xml
          sed -i "s#releases/tag/[^\"<]*#releases/tag/${TAG}#g" secretary.xml

      - name: Update creationDate in secretary.xml
        run: |
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s#<creationDate>[^<]*</creationDate>#<creationDate>${DATE}</creationDate>#" com_secretary/secretary.xml

      - name: Commit and push version bump
        # Pushed with the default GITHUB_TOKEN, so GitHub suppresses any resulting
        # push event - this cannot recursively trigger a workflow run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add secretary.xml com_secretary/secretary.xml
          if ! git diff --cached --quiet; then
            git commit -m "Bump version to ${{ inputs.tag }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Create and push tag
        run: |
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - name: Build packages
        run: |
          make secretary
          make secretary/module

      - name: Generate release notes from commits
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -vFx "${{ inputs.tag }}" | head -n1)

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG..${{ inputs.tag }}" --pretty=format:"- %s (%h)")
          else
            LOG=$(git log "${{ inputs.tag }}" --pretty=format:"- %s (%h)")
          fi

          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          body: ${{ steps.changelog.outputs.log }}
          files: _package/*.zip
